schema_version = 1

# Release images may contain permissive licenses and weak-copyleft MPL-2.0.
# A new or unknown expression is a review event, not an implicit approval.
allowed_expressions = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 OR BSD-3-Clause",
  "Apache-2.0 OR BSD-2-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  # Reviewed 2026-08-07 for Pillow, pulled in as a required dependency of
  # pikepdf by the PDF backend. MIT-CMU is the original PIL license: permissive
  # and non-copyleft, adding only a notice-retention duty (satisfied by the
  # wheel license files this script copies into the image) and a bar on using
  # the authors' names in advertising. Pillow's wheels also vendor image codecs
  # (libjpeg, zlib, libtiff, brotli, ...) whose own permissive notices ship in
  # the same LICENSE file and are copied with it.
  "MIT-CMU",
  "MPL-2.0",
  "PSF-2.0",
  "Python-2.0",
  "Unicode-3.0",
  "W3C-20150513",
  "Zlib",
  "BSD-3-Clause AND 0BSD AND MIT AND Zlib AND CC0-1.0",
]

# Some otherwise acceptable wheels publish ambiguous or absent core metadata.
# These reviewed overrides are intentionally package-specific.
[overrides]
annotated-types = "MIT"
fastjsonschema = "BSD-3-Clause"
fmpy = "BSD-2-Clause"
google-crc32c = "Apache-2.0"
jinja2 = "BSD-3-Clause"
openpyxl = "MIT"
owlrl = "W3C-20150513"
protobuf = "BSD-3-Clause"
pyasn1 = "BSD-2-Clause"
pyasn1-modules = "BSD-2-Clause"
pyshacl = "Apache-2.0"
saxonche = "MPL-2.0"
xlrd = "BSD-3-Clause"

[source_urls]
saxonche = "https://github.com/Saxonica/Saxon-HE"
